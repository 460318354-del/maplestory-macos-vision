name: Build Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install --upgrade pyinstaller

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m pytest -q

      - name: Build executable
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging\windows_entry.py")) {
            throw "Missing packaging\windows_entry.py"
          }
          Get-ChildItem packaging
          python -m PyInstaller packaging\MapleVision.spec --clean --noconfirm

      - name: Archive Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\MapleVision -DestinationPath dist\MapleVision-windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MapleVision-windows
          path: dist/MapleVision-windows.zip
