system:
  fps: 8
  dry_run: true
  debug: true
  debug_output: ""

game_window:
  title_contains: "MapleStory"

capture:
  test_image: ""

minimap:
  # Map content area inside the minimap, excluding the title/header.
  region: [70, 285, 500, 180]
  player_color_hsv:
    lower: [20, 120, 120]
    upper: [40, 255, 255]

combat:
  enabled: true
  attack_action: "hold_attack(ctrl)"
  heal_action: "heal(1)"
  observe_action: "observe"
  player:
    enabled: true
    name: "Conquerork"
    template: assets/templates/player/name_conquerork.png
    # Search the playable area while excluding most UI panels.
    search_region: [0, 500, 2200, 800]
    threshold: 0.75
    # The character's feet sit just above this name-tag template.
    anchor_offset: [70, -5]
  attack_range:
    # Provisional pixel bounds; validate against dry-run debug frames.
    x: 260
    y: 180
  monsters:
    enabled: true
    # Lower-left current-platform spawn area. Coordinates are relative to the
    # captured window image, not the macOS desktop.
    region: [0, 1220, 760, 150]
    templates:
      - assets/templates/stump/stump_single_light_upper.png
      - assets/templates/stump/stump_single_dark_upper.png
    threshold: 0.62
    overlap_threshold: 0.45
    peak_window: 45
    max_results: 8
    confirm_frames: 2
    max_misses: 2
    max_distance: 120
  health:
    enabled: true
    # Leave empty to auto-locate the bottom HP bar in the left half of the UI.
    region: []
    expected_width: 210
    low_threshold: 0.40
    color_hsv:
      ranges:
        - lower: [0, 100, 80]
          upper: [12, 255, 255]
        - lower: [168, 100, 80]
          upper: [179, 255, 255]

route:
  image: ""
  search_radius: 40
  colors:
    "255,0,0": "left"
    "0,0,255": "right"
    "255,127,0": "left_jump"
    "0,255,255": "right_jump"
    "127,255,0": "down_jump"
    "0,255,127": "stop"
    "255,255,0": "goal"
